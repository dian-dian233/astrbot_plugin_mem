<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>全局记忆 · astrbot_plugin_mem</title>
<style>
  :root{
    --bg:#F8F9FA; --surface:#FFFFFF; --surface-2:#FCFCFD;
    --text:#18181B; --text-2:#71717A; --text-3:#A1A1AA;
    --line:#E9EAEC; --hover:#F5F6F7; --focus:#111827;
    --accent:#1F3A32; --accent-soft:#EEF2F0;
    --fact:#64748B; --event:#5B7F6B; --plan:#A9814A; --pref:#7A6E86;
    --danger:#B4433A;
    --r-lg:12px; --r-md:8px; --r-sm:6px;
    --sp:4px;
    --shadow-1:0 1px 2px rgba(24,24,27,.04), 0 1px 1px rgba(24,24,27,.03);
    --shadow-2:0 12px 32px rgba(24,24,27,.10), 0 2px 8px rgba(24,24,27,.06);
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;background:var(--bg);color:var(--text);
    font:400 13px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .page{max-width:1440px;margin:0 auto;padding:28px 28px 64px}
  @media (max-width:900px){ .page{padding:20px 16px 48px} }

  /* ── 头部 ───────────────────────────── */
  .head{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:24px}
  .head h1{margin:0;font-size:21px;font-weight:600;letter-spacing:-.01em;line-height:1.3}
  .head p{margin:4px 0 0;font-size:13px;color:var(--text-2)}
  .head-actions{display:flex;align-items:center;gap:8px;flex-wrap:wrap}

  .status{
    display:inline-flex;align-items:center;gap:7px;height:32px;padding:0 11px;
    border:1px solid var(--line);border-radius:var(--r-md);background:var(--surface);
    font-size:12px;color:var(--text-2);cursor:default;
  }
  .dot{width:6px;height:6px;border-radius:50%;background:var(--text-3);flex:0 0 auto}
  .dot.on{background:#3F9D6B;box-shadow:0 0 0 3px rgba(63,157,107,.12)}
  .dot.off{background:#C9A227;box-shadow:0 0 0 3px rgba(201,162,39,.12)}

  .btn{
    display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 12px;
    border:1px solid var(--line);border-radius:var(--r-md);background:var(--surface);
    color:var(--text);font-size:13px;font-family:inherit;cursor:pointer;
    transition:background .14s ease,border-color .14s ease,opacity .14s ease;
  }
  .btn:hover{background:var(--hover)}
  .btn:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
  .btn:disabled{opacity:.45;cursor:not-allowed}
  .btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
  .btn.primary:hover{background:#16291f}
  .btn.ghost{border-color:transparent;background:transparent;color:var(--text-2)}
  .btn.ghost:hover{background:var(--hover);color:var(--text)}
  .btn.danger{color:var(--danger);border-color:#EBD3D0}
  .btn.danger:hover{background:#FBF3F2}

  /* ── 概览 ───────────────────────────── */
  .overview{
    display:flex;align-items:center;gap:28px;flex-wrap:wrap;
    background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);
    padding:16px 20px;margin-bottom:16px;box-shadow:var(--shadow-1);
  }
  .metrics{display:flex;gap:28px;flex-wrap:wrap}
  .metric{min-width:74px}
  .metric .k{font-size:12px;color:var(--text-2);margin-bottom:2px}
  .metric .v{font-size:25px;font-weight:600;letter-spacing:-.02em;line-height:1.15;font-variant-numeric:tabular-nums}
  .metric .v small{font-size:12px;font-weight:400;color:var(--text-3);margin-left:4px}
  .split{flex:1;min-width:260px}
  .split .bar{display:flex;height:8px;border-radius:99px;overflow:hidden;background:var(--hover);margin:8px 0 8px}
  .split .bar i{display:block;height:100%;transition:width .2s ease}
  .split .legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--text-2)}
  .split .legend span{display:inline-flex;align-items:center;gap:6px}
  .split .legend b{font-weight:600;color:var(--text);font-variant-numeric:tabular-nums}
  .sw{width:7px;height:7px;border-radius:2px}

  /* ── 工具栏 ─────────────────────────── */
  .toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
  .search{position:relative;flex:1;min-width:220px;max-width:400px}
  .search svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--text-3)}
  .search input{
    width:100%;height:34px;padding:0 10px 0 32px;border:1px solid var(--line);
    border-radius:var(--r-md);background:var(--surface);color:var(--text);
    font:inherit;font-size:13px;transition:border-color .14s ease,box-shadow .14s ease;
  }
  .search input::placeholder{color:var(--text-3)}
  .search input:focus{outline:none;border-color:#cfd2d6;box-shadow:0 0 0 3px rgba(24,24,27,.05)}
  .field{position:relative}
  select.field{
    height:34px;padding:0 28px 0 10px;border:1px solid var(--line);border-radius:var(--r-md);
    background:var(--surface);color:var(--text);font:inherit;font-size:13px;cursor:pointer;
    appearance:none;transition:background .14s ease,border-color .14s ease;
  }
  select.field:hover{background:var(--hover)}
  select.field:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
  .field::after{content:"";position:absolute;right:11px;top:50%;width:5px;height:5px;
    border-right:1px solid var(--text-3);border-bottom:1px solid var(--text-3);
    transform:translateY(-70%) rotate(45deg);pointer-events:none}
  .spacer{flex:1}

  /* ── 列表 ───────────────────────────── */
  .panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--shadow-1);overflow:hidden}
  .panel-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 16px;border-bottom:1px solid var(--line)}
  .panel-head h2{margin:0;font-size:14px;font-weight:600}
  .panel-head .sub{font-size:12px;color:var(--text-3);margin-left:8px;font-weight:400}
  .tabs{display:flex;gap:2px;background:var(--hover);padding:2px;border-radius:var(--r-sm)}
  .tabs button{
    height:26px;padding:0 11px;border:0;border-radius:5px;background:transparent;color:var(--text-2);
    font:inherit;font-size:12px;cursor:pointer;transition:background .14s ease,color .14s ease;
  }
  .tabs button[aria-selected="true"]{background:var(--surface);color:var(--text);box-shadow:var(--shadow-1)}

  .table-wrap{position:relative;min-height:220px}
  table{width:100%;border-collapse:separate;border-spacing:0;table-layout:fixed}
  thead th{
    position:sticky;top:0;z-index:1;background:var(--surface-2);
    padding:9px 16px;text-align:left;font-size:12px;font-weight:500;color:var(--text-3);
    border-bottom:1px solid var(--line);white-space:nowrap;
  }
  thead th.w-mem{width:24%} thead th.w-val{width:38%} thead th.w-type{width:96px}
  thead th.w-imp{width:104px} thead th.w-time{width:112px} thead th.w-act{width:52px}
  tbody tr{cursor:pointer;transition:background .12s ease}
  tbody tr:hover{background:var(--hover)}
  tbody tr:focus-visible{outline:2px solid var(--focus);outline-offset:-2px}
  tbody td{padding:11px 16px;border-bottom:1px solid var(--line);vertical-align:top}
  tbody tr:last-child td{border-bottom:0}

  .mem-sub{font-weight:600;color:var(--text);word-break:break-word}
  .mem-pre{color:var(--text-2);font-size:12px;margin-top:1px;word-break:break-word}
  .val{
    color:var(--text);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;
    overflow:hidden;word-break:break-word;overflow-wrap:anywhere;
  }
  .val mark{background:#FDF1C4;color:inherit;border-radius:3px;padding:0 1px}

  .tag{
    display:inline-flex;align-items:center;height:20px;padding:0 7px;border-radius:5px;
    font-size:11.5px;font-weight:500;letter-spacing:.01em;white-space:nowrap;
  }
  .tag.fact{color:var(--fact);background:#F1F4F8}
  .tag.event{color:var(--event);background:#EFF4F0}
  .tag.plan{color:var(--plan);background:#F8F2E9}
  .tag.preference{color:var(--pref);background:#F4F1F6}

  .imp{display:flex;align-items:center;gap:8px}
  .imp .n{font-size:12.5px;font-variant-numeric:tabular-nums;color:var(--text);min-width:30px}
  .imp .track{flex:1;height:3px;border-radius:99px;background:var(--hover);overflow:hidden;min-width:34px}
  .imp .track i{display:block;height:100%;background:#B9BEC6;border-radius:99px}

  .time{font-size:12.5px;color:var(--text-2);white-space:nowrap}
  .time .exact{display:block;font-size:11px;color:var(--text-3);margin-top:1px}

  .row-act{display:flex;justify-content:flex-end;opacity:0;transition:opacity .12s ease}
  tbody tr:hover .row-act, tbody tr:focus-within .row-act{opacity:1}
  .icon-btn{
    width:26px;height:26px;display:inline-flex;align-items:center;justify-content:center;
    border:1px solid transparent;border-radius:var(--r-sm);background:transparent;color:var(--text-2);
    cursor:pointer;font-size:15px;line-height:1;transition:background .12s ease,color .12s ease;
  }
  .icon-btn:hover{background:#EEF0F2;color:var(--text)}

  .skeleton{padding:14px 16px;display:flex;flex-direction:column;gap:12px}
  .sk-row{display:flex;gap:16px}
  .sk{background:linear-gradient(90deg,#F1F2F4 25%,#F7F8F9 37%,#F1F2F4 63%);background-size:400% 100%;
      animation:sk 1.4s ease infinite;border-radius:5px;height:12px}
  @keyframes sk{0%{background-position:100% 50%}100%{background-position:0 50%}}

  .empty{padding:56px 20px;text-align:center;color:var(--text-2)}
  .empty .big{font-size:14px;font-weight:500;color:var(--text);margin-bottom:4px}
  .empty .hint{font-size:12.5px;color:var(--text-3)}
  .empty button{margin-top:14px}

  .pager{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 16px;border-top:1px solid var(--line);font-size:12.5px;color:var(--text-2)}
  .pager .nav{display:flex;gap:6px;align-items:center}
  .pager .btn{height:28px;padding:0 10px;font-size:12.5px}

  /* ── 关系图 ─────────────────────────── */
  .graph-wrap{padding:12px 16px 4px}
  canvas{display:block;width:100%;height:420px}
  .graph-note{padding:0 16px 14px;font-size:12px;color:var(--text-3)}

  /* ── 抽屉 ───────────────────────────── */
  .scrim{position:fixed;inset:0;background:rgba(24,24,27,.28);opacity:0;pointer-events:none;transition:opacity .18s ease;z-index:40}
  .scrim.open{opacity:1;pointer-events:auto}
  .drawer{
    position:fixed;top:0;right:0;bottom:0;width:min(480px,92vw);background:var(--surface);
    border-left:1px solid var(--line);box-shadow:var(--shadow-2);z-index:41;
    transform:translateX(102%);transition:transform .2s cubic-bezier(.22,.61,.36,1);
    display:flex;flex-direction:column;
  }
  .drawer.open{transform:none}
  .drawer-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding:18px 20px 14px;border-bottom:1px solid var(--line)}
  .drawer-head h3{margin:0;font-size:16px;font-weight:600;word-break:break-word}
  .drawer-head .rel{font-size:12.5px;color:var(--text-2);margin-top:2px;word-break:break-word}
  .drawer-body{padding:18px 20px;overflow:auto;flex:1}
  .field-row{margin-bottom:18px}
  .field-row .label{font-size:11.5px;letter-spacing:.04em;text-transform:uppercase;color:var(--text-3);margin-bottom:6px}
  .value-box{
    position:relative;background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r-md);
    padding:12px 13px;font-size:13.5px;line-height:1.65;white-space:pre-wrap;word-break:break-word;
  }
  .value-box .copy{position:absolute;top:8px;right:8px;opacity:0;transition:opacity .14s ease}
  .value-box:hover .copy{opacity:1}
  .meta-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px 18px}
  .meta-grid .k{font-size:11.5px;color:var(--text-3);margin-bottom:2px}
  .meta-grid .v{font-size:13px;color:var(--text);word-break:break-all}
  .drawer-foot{padding:14px 20px;border-top:1px solid var(--line);display:flex;justify-content:space-between;gap:8px}

  /* ── 表单 ───────────────────────────── */
  .form label{display:block;font-size:12px;color:var(--text-2);margin:14px 0 5px}
  .form label .req{color:var(--danger);margin-left:2px}
  .form input,.form select,.form textarea{
    width:100%;border:1px solid var(--line);border-radius:var(--r-md);background:var(--surface);
    color:var(--text);font:inherit;font-size:13px;padding:8px 10px;transition:border-color .14s ease,box-shadow .14s ease;
  }
  .form textarea{min-height:92px;resize:vertical;line-height:1.6}
  .form input:focus,.form select:focus,.form textarea:focus{outline:none;border-color:#cfd2d6;box-shadow:0 0 0 3px rgba(24,24,27,.05)}
  .form .err{border-color:#E4B7B2;background:#FDF7F6}
  .form .msg{font-size:12px;color:var(--danger);margin-top:5px;min-height:16px}
  .form .hint{font-size:12px;color:var(--text-3);margin-top:5px}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}

  /* ── 提示 ───────────────────────────── */
  .toast{position:fixed;left:50%;bottom:26px;transform:translate(-50%,12px);z-index:60;
    display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
  .toast div{
    background:#18181B;color:#FAFAFA;border-radius:var(--r-md);padding:9px 14px;font-size:12.5px;
    box-shadow:var(--shadow-2);opacity:0;transform:translateY(6px);transition:opacity .16s ease,transform .16s ease;
    max-width:80vw;
  }
  .toast div.show{opacity:1;transform:none}
  .toast div.err{background:#7F2E28}

  .menu{position:fixed;z-index:50;background:var(--surface);border:1px solid var(--line);
    border-radius:var(--r-md);box-shadow:var(--shadow-2);padding:4px;min-width:132px;display:none}
  .menu.open{display:block}
  .menu button{display:block;width:100%;text-align:left;border:0;background:transparent;
    padding:7px 10px;border-radius:var(--r-sm);font:inherit;font-size:13px;color:var(--text);cursor:pointer}
  .menu button:hover{background:var(--hover)}
  .menu button.danger{color:var(--danger)}
  .menu hr{border:0;border-top:1px solid var(--line);margin:4px 0}

  @media (max-width:1100px){
    thead th.w-imp, tbody td.w-imp{display:none}
  }
  @media (max-width:860px){
    thead th.w-time, tbody td.w-time{display:none}
    thead th.w-mem{width:34%} thead th.w-val{width:auto}
    .overview{gap:18px}
    .metrics{gap:20px}
  }
  @media (max-width:620px){
    .table-wrap{overflow-x:auto}
    table{min-width:560px}
    .head h1{font-size:19px}
  }
  @media (prefers-reduced-motion:reduce){
    *{transition:none!important;animation:none!important}
  }
</style>
</head>
<body>
<div class="page">
  <header class="head">
    <div>
      <h1>全局记忆</h1>
      <p>管理跨会话共享的记忆信息</p>
    </div>
    <div class="head-actions">
      <span class="status" id="embedStatus" title="正在读取 Embedding 服务状态">
        <i class="dot" id="embedDot"></i><span id="embedText">Embedding 检测中</span>
      </span>
      <button class="btn" id="btnRefresh" title="重新加载">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
             stroke-linecap="round"><path d="M21 12a9 9 0 1 1-3-6.7"/><path d="M21 3v6h-6"/></svg>
        刷新
      </button>
      <button class="btn primary" id="btnNew">新增记忆</button>
    </div>
  </header>

  <section class="overview">
    <div class="metrics">
      <div class="metric"><div class="k">记忆总数</div><div class="v" id="mTotal">—</div></div>
      <div class="metric"><div class="k">有效记忆</div><div class="v" id="mActive">—</div></div>
      <div class="metric"><div class="k">已作废</div><div class="v" id="mHistory">—</div></div>
    </div>
    <div class="split">
      <div class="k" style="font-size:12px;color:var(--text-2)">类型分布</div>
      <div class="bar" id="typeBar"><i style="width:0;background:var(--fact)"></i></div>
      <div class="legend" id="typeLegend">
        <span><i class="sw" style="background:var(--fact)"></i>Fact <b>0</b></span>
        <span><i class="sw" style="background:var(--event)"></i>Event <b>0</b></span>
        <span><i class="sw" style="background:var(--plan)"></i>Plan <b>0</b></span>
        <span><i class="sw" style="background:var(--pref)"></i>Preference <b>0</b></span>
      </div>
    </div>
  </section>

  <div class="toolbar">
    <div class="search">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
           stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="q" placeholder="搜索主语 / 谓词 / 内容，回车执行" autocomplete="off" />
    </div>
    <div class="field">
      <select class="field" id="fType" aria-label="类型筛选">
        <option value="">全部类型</option>
        <option value="fact">Fact</option>
        <option value="event">Event</option>
        <option value="plan">Plan</option>
        <option value="preference">Preference</option>
      </select>
    </div>
    <div class="field">
      <select class="field" id="fStatus" aria-label="状态筛选" disabled
              title="当前接口只返回有效记忆，已作废记录仅在「已作废」统计中体现">
        <option value="active">有效记忆</option>
      </select>
    </div>
    <div class="field">
      <select class="field" id="fSort" aria-label="排序">
        <option value="updated_desc">最近更新</option>
        <option value="imp_desc">重要程度</option>
        <option value="subject_asc">主语 A→Z</option>
      </select>
    </div>
    <button class="btn" id="btnDedupe" title="同一主语+谓词只保留最新">合并重复</button>
    <button class="btn" id="btnConsolidate" title="同一主语且语义相近的多条合并">语义整合</button>
    <label class="btn" style="cursor:pointer;gap:6px" title="只统计不写库"><input type="checkbox" id="dry-run" checked style="height:13px;width:13px;min-width:0;cursor:pointer" />dry-run</label>
    <button class="btn ghost" id="btnReset">重置</button>
    <div class="spacer"></div>
    <div class="field">
      <select class="field" id="fLimit" aria-label="每页条数">
        <option value="20">20 条/页</option>
        <option value="50">50 条/页</option>
        <option value="100">100 条/页</option>
      </select>
    </div>
  </div>

  <div id="error" role="alert" hidden style="margin-bottom:12px;padding:10px 14px;border:1px solid #EBD3D0;background:#FDF7F6;color:#8C3A32;border-radius:8px;font-size:12.5px"></div>
  <section class="panel">
    <div class="panel-head">
      <h2>记忆列表<span class="sub" id="listSub">—</span></h2>
      <div class="tabs" role="tablist">
        <button role="tab" id="tabTable" aria-selected="true">列表</button>
        <button role="tab" id="tabGraph" aria-selected="false">关系图</button>
      </div>
    </div>

    <div id="viewTable">
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th class="w-mem">记忆</th>
              <th class="w-val">内容摘要</th>
              <th class="w-type">类型</th>
              <th class="w-imp">重要程度</th>
              <th class="w-time">更新时间</th>
              <th class="w-act"></th>
            </tr>
          </thead>
          <tbody id="tbody"></tbody>
        </table>
        <div id="listState"></div>
      </div>
      <div class="pager">
        <span id="pageInfo">—</span>
        <span class="nav">
          <button class="btn" id="prevPage">上一页</button>
          <button class="btn" id="nextPage">下一页</button>
        </span>
      </div>
    </div>

    <div id="viewGraph" hidden>
      <div class="graph-wrap"><canvas id="graph"></canvas></div>
      <div class="graph-note" id="graphNote">同一个主语的记忆连成一簇，节点大小按重要程度。</div>
    </div>
  </section>
</div>

<div class="scrim" id="scrim"></div>

<aside class="drawer" id="drawer" role="dialog" aria-modal="true" aria-label="记忆详情">
  <div class="drawer-head">
    <div>
      <h3 id="dSubject">—</h3>
      <div class="rel" id="dPredicate"></div>
    </div>
    <button class="icon-btn" id="dClose" title="关闭">✕</button>
  </div>
  <div class="drawer-body" id="dBody"></div>
  <div class="drawer-foot">
    <button class="btn danger" id="dVoid">作废这条记忆</button>
    <button class="btn" id="dCopy">复制内容</button>
  </div>
</aside>

<aside class="drawer" id="formDrawer" role="dialog" aria-modal="true" aria-label="新增记忆">
  <div class="drawer-head">
    <div><h3>新增记忆</h3><div class="rel">写一句事实，主语 + 谓词 + 值</div></div>
    <button class="icon-btn" id="fClose" title="关闭">✕</button>
  </div>
  <div class="drawer-body">
    <form class="form" id="addForm" novalidate>
      <div class="row2">
        <div>
          <label for="aSubject">主语<span class="req">*</span></label>
          <input id="aSubject" placeholder="例如：点点" maxlength="40" />
        </div>
        <div>
          <label for="aPredicate">谓词<span class="req">*</span></label>
          <input id="aPredicate" placeholder="例如：主力开发机" maxlength="40" />
        </div>
      </div>
      <label for="aValue">值<span class="req">*</span></label>
      <textarea id="aValue" placeholder="例如：freestyle-vm（4 核 7G）" maxlength="500"></textarea>
      <div class="hint">单条上限 120 字；不要写成「我今天跟他说了…」这类日记体。</div>
      <label for="aType">类型</label>
      <select id="aType">
        <option value="fact">Fact · 事实（3650 天）</option>
        <option value="preference">Preference · 偏好（365 天）</option>
        <option value="event">Event · 经历（30 天）</option>
        <option value="plan">Plan · 待办（2 天）</option>
      </select>
      <div class="msg" id="addMsg"></div>
    </form>
  </div>
  <div class="drawer-foot">
    <button class="btn" id="aCancel">取消</button>
    <button class="btn primary" id="aSave">保存</button>
  </div>
</aside>

<div class="menu" id="rowMenu">
  <button data-act="detail">查看详情</button>
  <hr />
  <button data-act="void" class="danger">作废</button>
</div>

<div class="toast" id="toast"></div>

<script>
(function () {
  "use strict";

  var API = "/api/plug/astrbot_plugin_mem/mem-api";
  var TYPE_LABEL = { fact: "Fact", event: "Event", plan: "Plan", preference: "Preference" };
  var TYPE_COLOR = { fact: "#64748B", event: "#5B7F6B", plan: "#A9814A", preference: "#7A6E86" };

  var state = { q: "", type: "", sort: "updated_desc", limit: 20, offset: 0, total: 0, items: [], loading: false, view: "table" };
  var current = null;

  function $(id) { return document.getElementById(id); }

  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }

  function toast(msg, isErr) {
    var el = document.createElement("div");
    if (isErr) el.className = "err";
    el.textContent = msg;
    $("toast").appendChild(el);
    requestAnimationFrame(function () { el.classList.add("show"); });
    setTimeout(function () {
      el.classList.remove("show");
      setTimeout(function () { el.remove(); }, 200);
    }, 2600);
  }

  async function api(path, opts) {
    var res = await fetch(API + path, Object.assign({
      credentials: "include",
      headers: { "Content-Type": "application/json" }
    }, opts || {}));
    var body = null;
    try { body = await res.json(); } catch (e) {
      throw new Error("接口返回不是 JSON（HTTP " + res.status + "）");
    }
    if (!res.ok) {
      throw new Error((body && body.message) || ("HTTP " + res.status));
    }
    if (body && body.status && body.status !== "ok") {
      throw new Error(body.message || "接口返回失败");
    }
    return body && Object.prototype.hasOwnProperty.call(body, "data") ? body.data : body;
  }

  function relTime(iso) {
    if (!iso) return "—";
    var t = Date.parse(iso);
    if (isNaN(t)) return String(iso).slice(0, 16).replace("T", " ");
    var diff = Math.max(0, Date.now() - t) / 1000;
    if (diff < 60) return "刚刚";
    if (diff < 3600) return Math.floor(diff / 60) + " 分钟前";
    if (diff < 86400) return Math.floor(diff / 3600) + " 小时前";
    if (diff < 86400 * 30) return Math.floor(diff / 86400) + " 天前";
    return new Date(t).toISOString().slice(0, 10);
  }

  function exactTime(iso) {
    if (!iso) return "";
    var t = Date.parse(iso);
    if (isNaN(t)) return String(iso).slice(0, 16).replace("T", " ");
    var d = new Date(t);
    function p(n) { return n < 10 ? "0" + n : "" + n; }
    return d.getFullYear() + "-" + p(d.getMonth() + 1) + "-" + p(d.getDate()) + " " + p(d.getHours()) + ":" + p(d.getMinutes());
  }

  function highlight(text, q) {
    var safe = esc(text);
    if (!q) return safe;
    var needle = esc(q).replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
    if (!needle) return safe;
    try {
      return safe.replace(new RegExp("(" + needle + ")", "gi"), "<mark>$1</mark>");
    } catch (e) { return safe; }
  }

  function showError(msg) {
    var el = $("error");
    el.textContent = String(msg || "请求失败");
    el.hidden = false;
  }
  function hideError() { var el = $("error"); el.hidden = true; el.textContent = ""; }

  async function maintenance(kind) {
    var dry = $("dry-run").checked;
    try {
      var d = await api("/" + kind, { method: "POST", body: JSON.stringify({ dry_run: dry }) });
      var msg = (d && (d.message || d.summary)) || "完成";
      toast((dry ? "[dry] " : "") + kind + "：" + msg);
      if (!dry) { loadList(); loadStats(); }
    } catch (e) { toast(kind + " 失败：" + e.message, true); }
  }

  /* ── 概览 ─────────────────────────────── */
  async function loadStats() {
    try {
      var d = await api("/stats");
      $("mTotal").textContent = d.total == null ? "—" : d.total;
      $("mActive").textContent = d.active == null ? "—" : d.active;
      $("mHistory").textContent = d.history == null ? "—" : d.history;

      var types = d.types || {};
      var total = 0;
      Object.keys(types).forEach(function (k) { total += Number(types[k]) || 0; });

      var order = ["fact", "event", "plan", "preference"];
      var bar = $("typeBar");
      bar.innerHTML = order.map(function (k) {
        var n = Number(types[k]) || 0;
        var w = total ? (n / total * 100) : 0;
        return '<i style="width:' + w.toFixed(2) + "%;background:" + TYPE_COLOR[k] + '"></i>';
      }).join("");

      $("typeLegend").innerHTML = order.map(function (k) {
        return '<span><i class="sw" style="background:' + TYPE_COLOR[k] + '"></i>' +
          TYPE_LABEL[k] + "<b>" + (Number(types[k]) || 0) + "</b></span>";
      }).join("");

      var prov = d.provider || {};
      var ok = prov.ok === true;
      $("embedDot").className = "dot " + (ok ? "on" : "off");
      $("embedText").textContent = ok ? "Embedding 可用" : "Embedding 不可用";
      $("embedStatus").title = ok
        ? ("模型：" + (prov.model || "未知") + (prov.id ? "（" + prov.id + "）" : ""))
        : "当前没有可用的 Embedding provider，检索会退回关键词匹配";
    } catch (e) {
      $("embedDot").className = "dot off";
      $("embedText").textContent = "Embedding 状态未知";
      $("embedStatus").title = e.message;
      toast("统计加载失败：" + e.message, true);
    }
  }

  /* ── 列表 ─────────────────────────────── */
  function skeleton() {
    var rows = "";
    for (var i = 0; i < 6; i++) {
      rows += '<div class="sk-row">' +
        '<div class="sk" style="width:22%"></div>' +
        '<div class="sk" style="width:42%"></div>' +
        '<div class="sk" style="width:10%"></div>' +
        '<div class="sk" style="width:12%"></div></div>';
    }
    $("tbody").innerHTML = "";
    $("listState").innerHTML = '<div class="skeleton">' + rows + "</div>";
  }

  function stateBlock(title, hint, withRetry) {
    $("listState").innerHTML = '<div class="empty"><div class="big">' + esc(title) + "</div>" +
      '<div class="hint">' + esc(hint) + "</div>" +
      (withRetry ? '<button class="btn" id="stateRetry">重试</button>' : "") + "</div>";
    var r = $("stateRetry");
    if (r) r.onclick = function () { loadList(); };
  }

  function sortItems(items) {
    var arr = items.slice();
    if (state.sort === "imp_desc") {
      arr.sort(function (a, b) { return (b.importance || 0) - (a.importance || 0); });
    } else if (state.sort === "subject_asc") {
      arr.sort(function (a, b) { return String(a.subject).localeCompare(String(b.subject), "zh"); });
    }
    return arr;
  }

  function renderRows(items) {
    if (!items.length) {
      if (state.q) stateBlock("没有匹配的记忆", "换个关键词，或清空搜索条件再看看", false);
      else stateBlock("还没有记忆", "点右上角「新增记忆」写第一条，或用 /mem add 指令", false);
      return;
    }
    $("listState").innerHTML = "";
    $("tbody").innerHTML = sortItems(items).map(function (it) {
      var imp = Math.max(0, Math.min(1, Number(it.importance) || 0));
      return '<tr data-id="' + it.id + '" tabindex="0">' +
        '<td><div class="mem-sub">' + highlight(it.subject, state.q) + "</div>" +
        '<div class="mem-pre">' + highlight(it.predicate, state.q) + "</div></td>" +
        '<td><div class="val">' + highlight(it.value_preview || it.value || "", state.q) + "</div></td>" +
        '<td><span class="tag ' + esc(it.mtype) + '">' + (TYPE_LABEL[it.mtype] || esc(it.mtype)) + "</span></td>" +
        '<td class="w-imp"><div class="imp"><span class="n">' + imp.toFixed(2) + "</span>" +
        '<span class="track"><i style="width:' + (imp * 100).toFixed(0) + '%"></i></span></div></td>' +
        '<td class="w-time"><span class="time">' + relTime(it.updated_at) +
        '<span class="exact">' + exactTime(it.updated_at) + "</span></span></td>" +
        '<td><div class="row-act"><button class="icon-btn" data-menu="' + it.id + '" title="更多操作">⋯</button></div></td>' +
        "</tr>";
    }).join("");
  }

  async function loadList() {
    if (state.loading) return;
    state.loading = true;
    skeleton();
    try {
      var qs = "?limit=" + state.limit + "&offset=" + state.offset +
        "&q=" + encodeURIComponent(state.q) + "&type=" + encodeURIComponent(state.type);
      var d = await api("/list" + qs);
      hideError();
      state.items = d.items || [];
      state.total = d.total || 0;
      renderRows(state.items);

      var from = state.total ? state.offset + 1 : 0;
      var to = Math.min(state.offset + state.limit, state.total);
      $("pageInfo").textContent = from + "–" + to + " / 共 " + state.total + " 条";
      $("listSub").textContent = state.total ? "共 " + state.total + " 条" : "";
      $("prevPage").disabled = state.offset <= 0;
      $("nextPage").disabled = to >= state.total;
    } catch (e) {
      $("tbody").innerHTML = "";
      stateBlock("加载失败", e.message, true);
      showError("列表加载失败：" + e.message);
      toast("列表加载失败：" + e.message, true);
    } finally {
      state.loading = false;
    }
  }

  /* ── 详情抽屉 ─────────────────────────── */
  function openDrawer(el) { el.classList.add("open"); $("scrim").classList.add("open"); }
  function closeDrawers() {
    $("drawer").classList.remove("open");
    $("formDrawer").classList.remove("open");
    $("scrim").classList.remove("open");
    $("rowMenu").classList.remove("open");
  }

  function openDetail(id) {
    var it = state.items.filter(function (x) { return String(x.id) === String(id); })[0];
    if (!it) return;
    current = it;
    $("dSubject").textContent = it.subject || "（无主语）";
    $("dPredicate").textContent = it.predicate || "";
    $("dBody").innerHTML =
      '<div class="field-row"><div class="label">内容</div>' +
      '<div class="value-box" id="dValueBox">' + esc(it.value || "") + "</div></div>" +
      '<div class="field-row"><div class="label">属性</div><div class="meta-grid">' +
      '<div><div class="k">类型</div><div class="v"><span class="tag ' + esc(it.mtype) + '">' +
      (TYPE_LABEL[it.mtype] || esc(it.mtype)) + "</span></div></div>" +
      '<div><div class="k">重要程度</div><div class="v">' + (Number(it.importance) || 0).toFixed(3) + "</div></div>" +
      '<div><div class="k">记忆 ID</div><div class="v">#' + it.id + "</div></div>" +
      '<div><div class="k">作用域</div><div class="v">' + esc(it.scope || "global") + "</div></div>" +
      '<div><div class="k">创建时间</div><div class="v">' + esc(exactTime(it.created_at) || "—") + "</div></div>" +
      '<div><div class="k">更新时间</div><div class="v">' + esc(exactTime(it.updated_at) || "—") + "</div></div>" +
      (it.source ? '<div><div class="k">来源</div><div class="v">' + esc(it.source) + "</div></div>" : "") +
      "</div></div>";
    openDrawer($("drawer"));
  }

  async function voidMemory(id) {
    if (!window.confirm("作废 #" + id + " ？\n作废只是把它从检索里摘掉，数据仍保留在库中。")) return;
    try {
      await api("/forget", { method: "POST", body: JSON.stringify({ id: Number(id) }) });
      toast("已作废 #" + id);
      closeDrawers();
      loadList();
      loadStats();
    } catch (e) { toast("作废失败：" + e.message, true); }
  }

  /* ── 关系图 ───────────────────────────── */
  var graphData = null;

  async function loadGraph() {
    try {
      var d = await api("/graph");
      graphData = d;
      drawGraph();
      var n = (d.nodes || []).length;
      $("graphNote").textContent = (d.truncated ? "记忆较多，只画了前 " + n + " 个节点。" : n + " 个节点。") +
        "同一个主语的记忆连成一簇，节点大小按重要程度。";
    } catch (e) { $("graphNote").textContent = "关系图加载失败：" + e.message; }
  }

  function drawGraph() {
    var cv = $("graph");
    if (!cv || !cv.clientWidth) return;
    var dpr = window.devicePixelRatio || 1;
    var w = cv.clientWidth, h = cv.clientHeight;
    cv.width = w * dpr; cv.height = h * dpr;
    var ctx = cv.getContext("2d");
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, w, h);
    if (!graphData) return;

    var nodes = graphData.nodes || [], edges = graphData.edges || [];
    if (!nodes.length) { $("graphNote").textContent = "还没有可画的记忆。"; return; }

    var pos = {};
    var bySubject = {};
    nodes.forEach(function (n) {
      var key = n.subject || n.label || "?";
      (bySubject[key] = bySubject[key] || []).push(n);
    });
    var keys = Object.keys(bySubject);
    var cx = w / 2, cy = h / 2, R = Math.min(w, h) * 0.36;
    keys.forEach(function (k, i) {
      var a = (i / Math.max(keys.length, 1)) * Math.PI * 2 - Math.PI / 2;
      var hx = cx + Math.cos(a) * R, hy = cy + Math.sin(a) * R;
      var group = bySubject[k];
      group.forEach(function (n, j) {
        var aa = (j / Math.max(group.length, 1)) * Math.PI * 2;
        var r = 22 + group.length * 1.5;
        pos[n.id] = { x: hx + Math.cos(aa) * r, y: hy + Math.sin(aa) * r };
      });
    });

    ctx.strokeStyle = "#E3E5E8"; ctx.lineWidth = 1;
    ctx.beginPath();
    edges.forEach(function (e) {
      var a = pos[e.source], b = pos[e.target];
      if (a && b) { ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); }
    });
    ctx.stroke();

    nodes.forEach(function (n) {
      var p = pos[n.id]; if (!p) return;
      var imp = Math.max(0, Math.min(1, Number(n.importance) || 0));
      var r = 2.5 + imp * 4.5;
      ctx.beginPath();
      ctx.arc(p.x, p.y, r, 0, Math.PI * 2);
      ctx.fillStyle = TYPE_COLOR[n.mtype] || "#9AA0A8";
      ctx.fill();
    });

    cv.onmousemove = function (ev) {
      var rect = cv.getBoundingClientRect();
      var mx = ev.clientX - rect.left, my = ev.clientY - rect.top;
      var best = null, bestD = 12;
      nodes.forEach(function (n) {
        var p = pos[n.id]; if (!p) return;
        var dd = Math.hypot(p.x - mx, p.y - my);
        if (dd < bestD) { bestD = dd; best = n; }
      });
      $("graphNote").textContent = best
        ? ((best.subject || "") + " · " + String(best.value || "").slice(0, 60))
        : (nodes.length + " 个节点。同一个主语的记忆连成一簇，节点大小按重要程度。");
    };

    keys.forEach(function (k, i) {
      var a = (i / Math.max(keys.length, 1)) * Math.PI * 2 - Math.PI / 2;
      var x = cx + Math.cos(a) * R, y = cy + Math.sin(a) * R;
      ctx.fillStyle = "#71717A"; ctx.font = "11px system-ui"; ctx.textAlign = "center";
      ctx.fillText(String(k).slice(0, 10), x, y - 16);
    });
  }

  /* ── 新增 ─────────────────────────────── */
  function setErr(input, msg) {
    if (msg) input.classList.add("err"); else input.classList.remove("err");
    $("addMsg").textContent = msg || "";
  }

  async function saveNew() {
    var subject = $("aSubject").value.trim();
    var predicate = $("aPredicate").value.trim();
    var value = $("aValue").value.trim();
    var input = !subject ? $("aSubject") : (!predicate ? $("aPredicate") : $("aValue"));
    if (!subject) return setErr(input, "请填写主语");
    if (!predicate) return setErr(input, "请填写谓词");
    if (!value) return setErr(input, "请填写值");
    if (value.length > 120) return setErr(input, "值超过 120 字，请压缩成一句事实");
    setErr(input, "");

    var btn = $("aSave");
    btn.disabled = true; btn.textContent = "保存中…";
    try {
      await api("/add", {
        method: "POST",
        body: JSON.stringify({ subject: subject, predicate: predicate, value: value, mtype: $("aType").value })
      });
      toast("已写入");
      $("aSubject").value = ""; $("aPredicate").value = ""; $("aValue").value = "";
      closeDrawers();
      state.offset = 0;
      loadList(); loadStats(); loadGraph();
    } catch (e) {
      setErr($("aValue"), e.message);
    } finally {
      btn.disabled = false; btn.textContent = "保存";
    }
  }

  /* ── 事件 ─────────────────────────────── */
  var menuTarget = null;
  document.addEventListener("click", function (ev) {
    var t = ev.target.closest ? ev.target.closest("[data-id]") : null;
    var menuBtn = ev.target.closest ? ev.target.closest("[data-menu]") : null;

    if (menuBtn) {
      ev.stopPropagation();
      menuTarget = menuBtn.getAttribute("data-menu");
      var r = menuBtn.getBoundingClientRect();
      var m = $("rowMenu");
      m.classList.add("open");
      m.style.left = Math.min(r.right - 132, window.innerWidth - 140) + "px";
      m.style.top = (r.bottom + 6) + "px";
      return;
    }
    if (!$("rowMenu").contains(ev.target)) $("rowMenu").classList.remove("open");

    if (t && !ev.target.closest("[data-menu]")) openDetail(t.getAttribute("data-id"));
  });

  $("rowMenu").addEventListener("click", function (ev) {
    var act = ev.target.getAttribute && ev.target.getAttribute("data-act");
    if (!act) return;
    $("rowMenu").classList.remove("open");
    if (act === "detail") openDetail(menuTarget);
    if (act === "void") voidMemory(menuTarget);
  });

  $("dClose").onclick = closeDrawers;
  $("scrim").onclick = closeDrawers;
  $("dVoid").onclick = function () { if (current) voidMemory(current.id); };
  $("dCopy").onclick = async function () {
    if (!current) return;
    try { await navigator.clipboard.writeText(current.value || ""); toast("已复制"); }
    catch (e) { toast("复制失败，请手动选择文本", true); }
  };

  $("btnNew").onclick = function () { closeDrawers(); openDrawer($("formDrawer")); $("aSubject").focus(); };
  $("fClose").onclick = closeDrawers;
  $("aCancel").onclick = closeDrawers;
  $("aSave").onclick = saveNew;
  document.addEventListener("keydown", function (ev) {
    if (ev.key === "Escape") closeDrawers();
    if ((ev.metaKey || ev.ctrlKey) && ev.key === "Enter") {
      if ($("formDrawer").classList.contains("open")) saveNew();
    }
  });

  var qTimer = null;
  $("q").addEventListener("input", function (ev) {
    clearTimeout(qTimer);
    var v = ev.target.value.trim();
    qTimer = setTimeout(function () {
      state.q = v; state.offset = 0; loadList();
    }, 300);
  });
  $("q").addEventListener("keydown", function (ev) {
    if (ev.key === "Enter") { clearTimeout(qTimer); state.q = ev.target.value.trim(); state.offset = 0; loadList(); }
  });
  $("fType").onchange = function (ev) { state.type = ev.target.value; state.offset = 0; loadList(); };
  $("fSort").onchange = function (ev) { state.sort = ev.target.value; renderRows(state.items); };
  $("fLimit").onchange = function (ev) { state.limit = Number(ev.target.value) || 20; state.offset = 0; loadList(); };
  $("btnReset").onclick = function () {
    state.q = ""; state.type = ""; state.sort = "updated_desc"; state.offset = 0;
    $("q").value = ""; $("fType").value = ""; $("fSort").value = "updated_desc";
    loadList();
  };
  $("btnRefresh").onclick = function () { loadStats(); loadList(); if (state.view === "graph") loadGraph(); };
  $("prevPage").onclick = function () { state.offset = Math.max(0, state.offset - state.limit); loadList(); };
  $("nextPage").onclick = function () { state.offset += state.limit; loadList(); };

  $("tabTable").onclick = function () {
    state.view = "table";
    $("tabTable").setAttribute("aria-selected", "true");
    $("tabGraph").setAttribute("aria-selected", "false");
    $("viewTable").hidden = false; $("viewGraph").hidden = true;
  };
  $("tabGraph").onclick = function () {
    state.view = "graph";
    $("tabGraph").setAttribute("aria-selected", "true");
    $("tabTable").setAttribute("aria-selected", "false");
    $("viewTable").hidden = true; $("viewGraph").hidden = false;
    loadGraph();
  };
  window.addEventListener("resize", function () { if (state.view === "graph") drawGraph(); });

  loadStats();
  loadList();
})();
</script>
</body>
</html>
