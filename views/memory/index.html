<!DOCTYPE html>
<html data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>全局记忆 · 管理</title>
<!-- AstrBot 会把这段改写成带 token 的地址；有它在，window.AstrBotPluginView 一定先于下方脚本就绪 -->
<script src="/api/plugin/page/bridge-sdk.js"></script>
<style>
  :root {
    --bg: #0f1115;
    --panel: #171a21;
    --panel-2: #1e222b;
    --border: #262b36;
    --text: #e6e9ef;
    --muted: #8b93a7;
    --accent: #5b8def;
    --danger: #ef5b6b;
    --ok: #3fb950;
    --warn: #d29922;
    --fact: #5b8def;
    --preference: #f0a85b;
    --event: #7fd1a0;
    --plan: #c084fc;
    --radius: 10px;
  }
  html[data-theme="light"] {
    --bg: #f6f7f9;
    --panel: #ffffff;
    --panel-2: #f0f2f5;
    --border: #dfe3ea;
    --text: #1c2128;
    --muted: #6b7280;
    --accent: #2f6fe0;
    --danger: #d1242f;
    --ok: #1a7f37;
    --warn: #9a6700;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 18px;
    background: var(--bg);
    color: var(--text);
    font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans CJK SC", "PingFang SC", "Microsoft YaHei", sans-serif;
  }
  h1 { font-size: 18px; margin: 0 0 4px; font-weight: 600; }
  .sub { color: var(--muted); font-size: 12px; margin-bottom: 16px; }
  .panel {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 14px;
    margin-bottom: 14px;
  }
  .row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .grow { flex: 1 1 220px; min-width: 160px; }
  input[type="text"], input[type="number"], select {
    background: var(--panel-2);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 8px 10px;
    font: inherit;
    outline: none;
    width: 100%;
  }
  input:focus, select:focus { border-color: var(--accent); }
  button {
    background: var(--panel-2);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 8px 14px;
    font: inherit;
    cursor: pointer;
    white-space: nowrap;
  }
  button:hover:not(:disabled) { border-color: var(--accent); }
  button:disabled { opacity: .5; cursor: not-allowed; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button.danger { color: var(--danger); }
  button.danger:hover:not(:disabled) { border-color: var(--danger); }

  #stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; margin-bottom: 14px; }
  .card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 12px 14px;
  }
  .card .k { color: var(--muted); font-size: 12px; }
  .card .v { font-size: 22px; font-weight: 650; margin-top: 2px; word-break: break-all; }
  .card .n { color: var(--muted); font-size: 11px; margin-top: 2px; word-break: break-all; }
  .ok { color: var(--ok); } .bad { color: var(--danger); } .warn { color: var(--warn); }

  #error {
    display: none;
    background: rgba(239, 91, 107, .12);
    border: 1px solid var(--danger);
    color: var(--danger);
    border-radius: var(--radius);
    padding: 10px 14px;
    margin-bottom: 14px;
    white-space: pre-wrap;
    word-break: break-word;
  }
  #error.show { display: block; }

  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--border); vertical-align: top; }
  th { color: var(--muted); font-weight: 600; font-size: 12px; white-space: nowrap; }
  tbody tr:hover { background: var(--panel-2); }
  td.num { color: var(--muted); font-variant-numeric: tabular-nums; }
  td.val { max-width: 380px; word-break: break-word; }
  .tag {
    display: inline-block; padding: 1px 8px; border-radius: 999px;
    font-size: 11px; border: 1px solid currentColor; line-height: 1.6;
  }
  .tag.fact { color: var(--fact); } .tag.preference { color: var(--preference); }
  .tag.event { color: var(--event); } .tag.plan { color: var(--plan); }
  .empty { color: var(--muted); text-align: center; padding: 28px 0; }
  .pager { display: flex; gap: 10px; align-items: center; justify-content: flex-end; margin-top: 12px; color: var(--muted); font-size: 12px; }

  #ops-result, #graph-hint { color: var(--muted); font-size: 12px; margin-top: 10px; min-height: 18px; }
  .check { display: inline-flex; gap: 6px; align-items: center; color: var(--muted); font-size: 13px; cursor: pointer; }
  .check input { accent-color: var(--accent); }

  #graph-wrap { position: relative; width: 100%; height: 460px; background: var(--panel-2); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; }
  #graph { display: block; width: 100%; height: 100%; cursor: default; }
  #tip {
    position: absolute; display: none; pointer-events: none;
    background: var(--panel); border: 1px solid var(--border); border-radius: 8px;
    padding: 6px 10px; font-size: 12px; max-width: 320px; z-index: 5;
    box-shadow: 0 6px 20px rgba(0,0,0,.35); word-break: break-word;
  }
  #tip b { display: block; font-size: 12px; margin-bottom: 2px; }
  .legend { display: flex; gap: 14px; flex-wrap: wrap; color: var(--muted); font-size: 12px; margin-top: 8px; }
  .legend i { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 5px; }

  #modal { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; background: rgba(0,0,0,.5); z-index: 50; padding: 18px; }
  #modal.show { display: flex; }
  #modal .box { background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius); padding: 18px; width: 100%; max-width: 520px; }
  #modal .box h2 { font-size: 15px; margin: 0 0 14px; }
  #modal label { display: block; color: var(--muted); font-size: 12px; margin: 10px 0 4px; }
  #modal .actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 18px; }
  #modal-error { color: var(--danger); font-size: 12px; margin-top: 10px; min-height: 16px; }
</style>
</head>
<body>

<h1>全局记忆 · 管理</h1>
<div class="sub">跨会话共享的事实库。作废只填 <code>valid_to</code>，不物理删除，历史可回溯。</div>

<div id="error" role="alert"></div>

<div id="stats">
  <div class="card"><div class="k">总数</div><div class="v" id="stat-total">–</div><div class="n" id="stat-total-n">有效 + 已作废</div></div>
  <div class="card"><div class="k">有效</div><div class="v" id="stat-active">–</div><div class="n" id="stat-active-n">参与检索</div></div>
  <div class="card"><div class="k">已作废</div><div class="v" id="stat-history">–</div><div class="n" id="stat-history-n">仅存档</div></div>
  <div class="card"><div class="k">Embedding</div><div class="v" id="stat-provider">–</div><div class="n" id="stat-provider-n">provider 状态</div></div>
</div>

<div class="panel">
  <div class="row">
    <div class="grow"><input type="text" id="search" placeholder="搜 subject / predicate / value；回车生效" autocomplete="off"></div>
    <div style="width:150px">
      <select id="type-filter" aria-label="类型过滤">
        <option value="">全部类型</option>
        <option value="fact">fact 事实</option>
        <option value="preference">preference 偏好</option>
        <option value="event">event 事件</option>
        <option value="plan">plan 计划</option>
      </select>
    </div>
    <button id="btn-add" class="primary">新增记忆</button>
    <button id="btn-refresh">刷新</button>
  </div>
</div>

<div class="panel">
  <table id="table">
    <thead>
      <tr>
        <th style="width:56px">ID</th>
        <th>subject</th>
        <th>predicate</th>
        <th>value</th>
        <th style="width:96px">mtype</th>
        <th style="width:88px">importance</th>
        <th style="width:170px">更新时间</th>
        <th style="width:72px">操作</th>
      </tr>
    </thead>
    <tbody id="table-body">
      <tr><td colspan="8" class="empty">加载中…</td></tr>
    </tbody>
  </table>
  <div class="pager">
    <span id="page-info">—</span>
    <button id="btn-prev">上一页</button>
    <button id="btn-next">下一页</button>
  </div>
</div>

<div class="panel">
  <div class="row">
    <label class="check"><input type="checkbox" id="dry-run" checked>dry-run（只报告，不改库）</label>
    <button id="btn-dedupe">同槽去重</button>
    <button id="btn-consolidate">同主语合并</button>
  </div>
  <div id="ops-result">点上面的按钮跑一遍；勾着 dry-run 不会动数据。</div>
</div>

<div class="panel">
  <div class="row" style="margin-bottom:10px">
    <strong style="font-size:13px">关系图</strong>
    <span style="color:var(--muted);font-size:12px">同一 subject 连成簇；点大小按 importance，颜色按 mtype，悬停看内容</span>
  </div>
  <div id="graph-wrap">
    <canvas id="graph" width="900" height="460"></canvas>
    <div id="tip"></div>
  </div>
  <div id="graph-hint"></div>
  <div class="legend">
    <span><i style="background:var(--fact)"></i>fact</span>
    <span><i style="background:var(--preference)"></i>preference</span>
    <span><i style="background:var(--event)"></i>event</span>
    <span><i style="background:var(--plan)"></i>plan</span>
  </div>
</div>

<div id="modal">
  <div class="box">
    <h2>新增一条事实</h2>
    <label for="f-subject">subject（主语，≤40 字）</label>
    <input type="text" id="f-subject" placeholder="例：点点">
    <label for="f-predicate">predicate（谓词）</label>
    <input type="text" id="f-predicate" placeholder="例：喜欢喝">
    <label for="f-value">value（内容，≤120 字，拒绝叙事体）</label>
    <input type="text" id="f-value" placeholder="例：冰美式">
    <label for="f-mtype">mtype（留空自动推断）</label>
    <select id="f-mtype">
      <option value="">自动</option>
      <option value="fact">fact</option>
      <option value="preference">preference</option>
      <option value="event">event</option>
      <option value="plan">plan</option>
    </select>
    <label for="f-importance">importance（0~1，留空用默认）</label>
    <input type="number" id="f-importance" min="0" max="1" step="0.05" placeholder="0.8">
    <div id="modal-error"></div>
    <div class="actions">
      <button id="btn-cancel">取消</button>
      <button id="btn-submit" class="primary">写入</button>
    </div>
  </div>
</div>

<script>
(function () {
  "use strict";

  var PAGE_SIZE = 20;
  var state = { q: "", type: "", offset: 0, total: 0, items: [] };
  var graphNodes = [];
  var pending = false;

  function $(id) { return document.getElementById(id); }

  function showError(message) {
    var box = $("error");
    box.textContent = String(message || "未知错误");
    box.classList.add("show");
  }
  function clearError() {
    var box = $("error");
    box.textContent = "";
    box.classList.remove("show");
  }

  function bridge() {
    return window.AstrBotPluginView || window.AstrBotPluginPage || null;
  }

  function waitBridge(timeoutMs) {
    return new Promise(function (resolve) {
      var started = Date.now();
      (function poll() {
        if (bridge()) { resolve(bridge()); return; }
        if (Date.now() - started > timeoutMs) { resolve(null); return; }
        setTimeout(poll, 50);
      })();
    });
  }

  // 所有请求都走桥：页面在 iframe 里，直连 fetch 拿不到 dashboard 的凭证。
  async function apiGet(endpoint, params) {
    var b = bridge();
    if (!b) { throw new Error("插件页面桥未就绪：请从 AstrBot 控制台「插件 → 全局记忆 → 管理页」进入"); }
    try {
      return await b.apiGet(endpoint, params || {});
    } catch (e) {
      throw new Error((e && e.message) ? e.message : "请求失败");
    }
  }

  async function apiPost(endpoint, body) {
    var b = bridge();
    if (!b) { throw new Error("插件页面桥未就绪：请从 AstrBot 控制台「插件 → 全局记忆 → 管理页」进入"); }
    try {
      return await b.apiPost(endpoint, body || {});
    } catch (e) {
      throw new Error((e && e.message) ? e.message : "请求失败");
    }
  }

  function fmtTime(value) {
    if (!value) { return "—"; }
    return String(value).replace("T", " ").replace(/\.\d+/, "").replace(/(\+\d\d:\d\d|Z)$/, "");
  }

  function cell(row, text, className) {
    var td = document.createElement("td");
    if (className) { td.className = className; }
    td.textContent = text;
    row.appendChild(td);
    return td;
  }

  function renderTable() {
    var body = $("table-body");
    body.textContent = "";
    if (!state.items.length) {
      var tr = document.createElement("tr");
      var td = document.createElement("td");
      td.colSpan = 8;
      td.className = "empty";
      td.textContent = state.total ? "这一页没有数据，试试上一页" : "没有匹配的记忆";
      tr.appendChild(td);
      body.appendChild(tr);
    } else {
      state.items.forEach(function (item) {
        var tr = document.createElement("tr");
        cell(tr, String(item.id), "num");
        cell(tr, item.subject || "", "");
        cell(tr, item.predicate || "", "");
        cell(tr, item.value || "", "val");
        var typeTd = document.createElement("td");
        var tag = document.createElement("span");
        tag.className = "tag " + (item.mtype || "fact");
        tag.textContent = item.mtype || "fact";
        typeTd.appendChild(tag);
        tr.appendChild(typeTd);
        cell(tr, (item.importance === null || item.importance === undefined) ? "—" : Number(item.importance).toFixed(2), "num");
        cell(tr, fmtTime(item.updated_at), "num");
        var opTd = document.createElement("td");
        var btn = document.createElement("button");
        btn.className = "danger";
        btn.textContent = "作废";
        btn.addEventListener("click", function () { forget(item.id); });
        opTd.appendChild(btn);
        tr.appendChild(opTd);
        body.appendChild(tr);
      });
    }
    var from = state.total ? state.offset + 1 : 0;
    var to = Math.min(state.offset + PAGE_SIZE, state.total);
    $("page-info").textContent = from + "–" + to + " / 共 " + state.total + " 条";
    $("btn-prev").disabled = state.offset <= 0;
    $("btn-next").disabled = state.offset + PAGE_SIZE >= state.total;
  }

  function renderStats(data) {
    $("stat-total").textContent = data.total;
    $("stat-active").textContent = data.active;
    $("stat-history").textContent = data.history;
    var prov = data.provider || {};
    var el = $("stat-provider");
    if (prov.ok) {
      el.textContent = "可用";
      el.className = "v ok";
      $("stat-provider-n").textContent = (prov.model || prov.id || "已配置");
    } else {
      el.textContent = "不可用";
      el.className = "v bad";
      $("stat-provider-n").textContent = "检索退关键词";
    }
    var extra = [];
    if (data.last_updated) { extra.push("最近更新 " + fmtTime(data.last_updated)); }
    if (data.vec_rows) { extra.push("向量 " + data.vec_rows + " 条"); }
    $("stat-total-n").textContent = extra.length ? extra.join(" · ") : (data.path || "有效 + 已作废");
    var types = data.types || {};
    var parts = [];
    Object.keys(types).forEach(function (key) { parts.push(key + " " + types[key]); });
    $("stat-active-n").textContent = parts.length ? parts.join(" · ") : "参与检索";
  }

  async function loadList() {
    if (pending) { return; }
    pending = true;
    try {
      var data = await apiGet("mem-api/list", {
        q: state.q, type: state.type, limit: PAGE_SIZE, offset: state.offset
      });
      state.items = (data && data.items) || [];
      state.total = (data && data.total) || 0;
      // total 变小后 offset 可能越界，回退到最后一页
      if (!state.items.length && state.total > 0 && state.offset > 0) {
        state.offset = Math.max(0, (Math.ceil(state.total / PAGE_SIZE) - 1) * PAGE_SIZE);
        pending = false;
        return loadList();
      }
      clearError();
      renderTable();
    } catch (e) {
      showError("加载列表失败：" + e.message);
      state.items = [];
      state.total = 0;
      renderTable();
    } finally {
      pending = false;
    }
  }

  async function loadStats() {
    try {
      renderStats(await apiGet("mem-api/stats", {}));
    } catch (e) {
      showError("加载统计失败：" + e.message);
      $("stat-total").textContent = "!";
      $("stat-active").textContent = "!";
      $("stat-history").textContent = "!";
      $("stat-provider").textContent = "!";
      $("stat-provider").className = "v bad";
    }
  }

  async function loadGraph() {
    try {
      var data = await apiGet("mem-api/graph", {});
      drawGraph(data || {});
    } catch (e) {
      showError("加载关系图失败：" + e.message);
      $("graph-hint").textContent = "关系图加载失败：" + e.message;
      drawGraph({ nodes: [], edges: [] });
    }
  }

  function refreshAll() {
    return Promise.all([loadList(), loadStats(), loadGraph()]);
  }

  async function forget(id) {
    if (!window.confirm("确定作废 #" + id + "？作废后不再参与检索（数据仍在库里）。")) { return; }
    try {
      await apiPost("mem-api/forget", { id: id });
      clearError();
      await refreshAll();
    } catch (e) {
      showError("作废失败：" + e.message);
    }
  }

  function opsResult(text, isError) {
    var el = $("ops-result");
    el.textContent = text;
    el.className = isError ? "bad" : "";
  }

  async function runOps(kind) {
    var dryRun = $("dry-run").checked;
    var endpoint = kind === "dedupe" ? "mem-api/dedupe" : "mem-api/consolidate";
    var button = kind === "dedupe" ? $("btn-dedupe") : $("btn-consolidate");
    button.disabled = true;
    opsResult("跑着…");
    try {
      var data = await apiPost(endpoint, { dry_run: dryRun });
      opsResult(data.summary || "完成");
      clearError();
      if (!dryRun) { await refreshAll(); } else { await loadStats(); }
    } catch (e) {
      opsResult((kind === "dedupe" ? "去重" : "合并") + "失败：" + e.message, true);
      showError((kind === "dedupe" ? "去重" : "合并") + "失败：" + e.message);
    } finally {
      button.disabled = false;
    }
  }

  // ── 关系图 ──────────────────────────────────────────────────────────
  var COLORS = { fact: "#5b8def", preference: "#f0a85b", event: "#7fd1a0", plan: "#c084fc" };
  var hoverNode = null;
  var lastGraph = { nodes: [], edges: [] };

  function resizeCanvas() {
    var canvas = $("graph");
    var wrap = $("graph-wrap");
    var dpr = window.devicePixelRatio || 1;
    var w = wrap.clientWidth || 900;
    var h = wrap.clientHeight || 460;
    canvas.width = Math.round(w * dpr);
    canvas.height = Math.round(h * dpr);
    canvas.style.width = w + "px";
    canvas.style.height = h + "px";
    var ctx = canvas.getContext("2d");
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    return { ctx: ctx, w: w, h: h };
  }

  function borderRadius(importance) {
    var value = Number(importance);
    if (isNaN(value)) { value = 0.5; }
    value = Math.max(0, Math.min(1, value));
    return 5 + value * 9;
  }

  function drawGraph(data) {
    lastGraph = data || { nodes: [], edges: [] };
    var nodes = lastGraph.nodes || [];
    var edges = lastGraph.edges || [];
    var sized = resizeCanvas();
    var ctx = sized.ctx, w = sized.w, h = sized.h;

    var styles = getComputedStyle(document.documentElement);
    var border = styles.getPropertyValue("--border").trim() || "#262b36";
    var textColor = styles.getPropertyValue("--text").trim() || "#e6e9ef";

    // 同 subject 聚簇：label 形如 "subject · predicate"
    var clusters = [];
    var index = {};
    nodes.forEach(function (node) {
      var subject = String(node.label || "").split(" · ")[0] || ("#" + node.id);
      if (!index[subject]) { index[subject] = { name: subject, nodes: [] }; clusters.push(index[subject]); }
      index[subject].nodes.push(node);
    });

    var cols = Math.max(1, Math.ceil(Math.sqrt(clusters.length)));
    var rows = Math.max(1, Math.ceil(clusters.length / cols));
    var cellW = w / cols;
    var cellH = h / rows;

    var positions = {};
    graphNodes = [];
    clusters.forEach(function (cluster, ci) {
      var cx = (ci % cols) * cellW + cellW / 2;
      var cy = Math.floor(ci / cols) * cellH + cellH / 2;
      var radius = Math.max(18, Math.min(cellW, cellH) * 0.3);
      cluster.nodes.forEach(function (node, ni) {
        var angle = (Math.PI * 2 * ni) / Math.max(1, cluster.nodes.length) - Math.PI / 2;
        var x = cluster.nodes.length === 1 ? cx : cx + Math.cos(angle) * radius;
        var y = cluster.nodes.length === 1 ? cy : cy + Math.sin(angle) * radius;
        positions[node.id] = { x: x, y: y };
        graphNodes.push({
          id: node.id, x: x, y: y, r: borderRadius(node.importance),
          label: node.label, value: node.value, mtype: node.mtype || "fact"
        });
      });
    });

    ctx.clearRect(0, 0, w, h);

    // 边
    ctx.strokeStyle = border;
    ctx.lineWidth = 1;
    edges.forEach(function (edge) {
      var a = positions[edge.source], b = positions[edge.target];
      if (!a || !b) { return; }
      ctx.beginPath();
      ctx.moveTo(a.x, a.y);
      ctx.lineTo(b.x, b.y);
      ctx.stroke();
    });

    // 节点
    ctx.font = "11px -apple-system, 'Noto Sans CJK SC', sans-serif";
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    graphNodes.forEach(function (node) {
      ctx.beginPath();
      ctx.fillStyle = COLORS[node.mtype] || COLORS.fact;
      ctx.globalAlpha = hoverNode && hoverNode.id === node.id ? 1 : 0.88;
      ctx.arc(node.x, node.y, node.r, 0, Math.PI * 2);
      ctx.fill();
      ctx.globalAlpha = 1;
      if (hoverNode && hoverNode.id === node.id) {
        ctx.strokeStyle = textColor;
        ctx.lineWidth = 1.5;
        ctx.stroke();
      }
    });

    // 簇标签（只给有多个节点的簇标名字，免得糊成一片）
    ctx.fillStyle = textColor;
    ctx.globalAlpha = 0.55;
    clusters.forEach(function (cluster, ci) {
      if (cluster.nodes.length < 2) { return; }
      var cx = (ci % cols) * cellW + cellW / 2;
      var cy = Math.floor(ci / cols) * cellH + 14;
      var name = cluster.name.length > 14 ? cluster.name.slice(0, 14) + "…" : cluster.name;
      ctx.fillText(name, cx, cy);
    });
    ctx.globalAlpha = 1;

    var hint = $("graph-hint");
    if (!nodes.length) {
      hint.textContent = "库里还没有有效记忆，新增一条就会出现在这里。";
    } else if (data && data.truncated) {
      hint.textContent = "共 " + data.total_nodes + " 个节点，只画了前 " + data.shown_nodes + " 个（上限 " + data.max_nodes + "）；用搜索缩小范围能看全。";
    } else {
      hint.textContent = "共 " + nodes.length + " 个节点 / " + edges.length + " 条边。";
    }
  }

  function hitTest(event) {
    var canvas = $("graph");
    var rect = canvas.getBoundingClientRect();
    var x = event.clientX - rect.left;
    var y = event.clientY - rect.top;
    var found = null;
    // 后画的在上层：倒着找
    for (var i = graphNodes.length - 1; i >= 0; i -= 1) {
      var node = graphNodes[i];
      var dx = node.x - x, dy = node.y - y;
      if (dx * dx + dy * dy <= Math.max(node.r + 3, 9) * Math.max(node.r + 3, 9)) { found = node; break; }
    }
    return { node: found, x: x, y: y };
  }

  function bindGraphHover() {
    var canvas = $("graph");
    var tip = $("tip");
    canvas.addEventListener("mousemove", function (event) {
      var hit = hitTest(event);
      if (hit.node) {
        if (!hoverNode || hoverNode.id !== hit.node.id) {
          hoverNode = hit.node;
          drawGraph(lastGraph);
        }
        var value = String(hit.node.value || "").slice(0, 60);
        tip.textContent = "";
        var title = document.createElement("b");
        title.textContent = "#" + hit.node.id + " " + (hit.node.label || "");
        tip.appendChild(title);
        tip.appendChild(document.createTextNode(value || "（无内容）"));
        tip.style.display = "block";
        var wrap = $("graph-wrap");
        var left = hit.x + 14;
        if (left + 260 > wrap.clientWidth) { left = Math.max(4, hit.x - 260); }
        tip.style.left = left + "px";
        tip.style.top = Math.max(4, hit.y + 14) + "px";
        canvas.style.cursor = "pointer";
      } else {
        if (hoverNode) { hoverNode = null; drawGraph(lastGraph); }
        tip.style.display = "none";
        canvas.style.cursor = "default";
      }
    });
    canvas.addEventListener("mouseleave", function () {
      if (hoverNode) { hoverNode = null; drawGraph(lastGraph); }
      tip.style.display = "none";
    });
    window.addEventListener("resize", function () { drawGraph(lastGraph); });
  }

  // ── 新增弹窗 ────────────────────────────────────────────────────────
  function openModal() {
    $("f-subject").value = "";
    $("f-predicate").value = "";
    $("f-value").value = "";
    $("f-mtype").value = "";
    $("f-importance").value = "";
    $("modal-error").textContent = "";
    $("modal").classList.add("show");
    $("f-subject").focus();
  }
  function closeModal() { $("modal").classList.remove("show"); }

  async function submitAdd() {
    var payload = {
      subject: $("f-subject").value.trim(),
      predicate: $("f-predicate").value.trim(),
      value: $("f-value").value.trim(),
      mtype: $("f-mtype").value,
      importance: $("f-importance").value
    };
    var err = $("modal-error");
    if (!payload.subject || !payload.predicate || !payload.value) {
      err.textContent = "subject / predicate / value 都要填。";
      return;
    }
    if (payload.importance !== "" && (isNaN(Number(payload.importance)) || Number(payload.importance) < 0 || Number(payload.importance) > 1)) {
      err.textContent = "importance 要是 0~1 的小数。";
      return;
    }
    if (payload.importance === "") { delete payload.importance; }
    if (!payload.mtype) { delete payload.mtype; }
    $("btn-submit").disabled = true;
    err.textContent = "";
    try {
      await apiPost("mem-api/add", payload);
      closeModal();
      clearError();
      await refreshAll();
    } catch (e) {
      err.textContent = e.message;
      showError("新增失败：" + e.message);
    } finally {
      $("btn-submit").disabled = false;
    }
  }

  function bindEvents() {
    var searchTimer = null;
    $("search").addEventListener("input", function () {
      clearTimeout(searchTimer);
      searchTimer = setTimeout(function () {
        state.q = $("search").value.trim();
        state.offset = 0;
        loadList();
      }, 250);
    });
    $("search").addEventListener("keydown", function (event) {
      if (event.key === "Enter") {
        clearTimeout(searchTimer);
        state.q = $("search").value.trim();
        state.offset = 0;
        loadList();
      }
    });
    $("type-filter").addEventListener("change", function () {
      state.type = $("type-filter").value;
      state.offset = 0;
      loadList();
    });
    $("btn-refresh").addEventListener("click", function () { refreshAll(); });
    $("btn-prev").addEventListener("click", function () {
      state.offset = Math.max(0, state.offset - PAGE_SIZE);
      loadList();
    });
    $("btn-next").addEventListener("click", function () {
      state.offset += PAGE_SIZE;
      loadList();
    });
    $("btn-add").addEventListener("click", openModal);
    $("btn-cancel").addEventListener("click", closeModal);
    $("btn-submit").addEventListener("click", submitAdd);
    $("btn-dedupe").addEventListener("click", function () { runOps("dedupe"); });
    $("btn-consolidate").addEventListener("click", function () { runOps("consolidate"); });
    $("modal").addEventListener("click", function (event) {
      if (event.target === $("modal")) { closeModal(); }
    });
    document.addEventListener("keydown", function (event) {
      if (event.key === "Escape") { closeModal(); }
    });
    bindGraphHover();
  }

  async function start() {
    bindEvents();
    var b = await waitBridge(5000);
    if (!b) {
      showError("插件页面桥未就绪：请从 AstrBot 控制台「插件 → 全局记忆 → 管理页」进入，不要在浏览器里直接打开这个文件。");
      $("table-body").textContent = "";
      var tr = document.createElement("tr");
      var td = document.createElement("td");
      td.colSpan = 8;
      td.className = "empty";
      td.textContent = "等待页面桥…";
      tr.appendChild(td);
      $("table-body").appendChild(tr);
      return;
    }
    if (b.ready) {
      try { await b.ready(); } catch (e) { /* ready 失败不挡加载，后面请求会报具体错 */ }
    }
    await refreshAll();
  }

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", start);
  } else {
    start();
  }
})();
</script>
</body>
</html>
